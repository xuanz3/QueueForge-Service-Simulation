name: queueforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${QUEUEFORGE_POSTGRES_DB:-queueforge}
      POSTGRES_USER: ${QUEUEFORGE_POSTGRES_USER:-queueforge}
      POSTGRES_PASSWORD: ${QUEUEFORGE_POSTGRES_PASSWORD:-queueforge_local_only}
    ports:
      - "${QUEUEFORGE_DB_PORT:-55436}:5432"
    volumes:
      - queueforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${QUEUEFORGE_POSTGRES_USER:-queueforge} -d ${QUEUEFORGE_POSTGRES_DB:-queueforge}
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: services/control-plane-java/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${QUEUEFORGE_POSTGRES_DB:-queueforge}
      SPRING_DATASOURCE_USERNAME: ${QUEUEFORGE_POSTGRES_USER:-queueforge}
      SPRING_DATASOURCE_PASSWORD: ${QUEUEFORGE_POSTGRES_PASSWORD:-queueforge_local_only}
      QUEUEFORGE_WEB_ORIGIN: http://localhost:${QUEUEFORGE_WEB_PORT:-15176}
      QUEUEFORGE_WORK_ROOT: /var/lib/queueforge/runs
      QUEUEFORGE_SIMULATION_COMMAND: /usr/local/bin/queueforge-sim
      QUEUEFORGE_ANALYTICS_PYTHON: /usr/local/bin/python
      QUEUEFORGE_ANALYTICS_MODULE: queueforge_analytics
      QUEUEFORGE_ANALYTICS_ENGINE: /usr/local/bin/queueforge-sim
      QUEUEFORGE_WORKER_TIMEOUT: PT5M
      QUEUEFORGE_WORKER_CONCURRENCY: 2
    ports:
      - "${QUEUEFORGE_API_PORT:-18086}:8080"
    volumes:
      - queueforge-runs:/var/lib/queueforge/runs
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s

  web:
    build:
      context: apps/web
      args:
        VITE_API_BASE_URL: http://localhost:${QUEUEFORGE_API_PORT:-18086}
    ports:
      - "${QUEUEFORGE_WEB_PORT:-15176}:5173"
    depends_on:
      - api

  cpp-engine:
    profiles:
      - tools
    build:
      context: engines/simulation-cpp
    command:
      - --health

  python-analytics:
    profiles:
      - tools
    build:
      context: .
      dockerfile: analytics/queueforge-python/Dockerfile
    command:
      - python
      - -m
      - queueforge_analytics
      - health

volumes:
  queueforge-postgres:
  queueforge-runs:
