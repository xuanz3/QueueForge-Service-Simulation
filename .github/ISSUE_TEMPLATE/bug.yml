name: Bug
description: Record a reproducible defect
title: "[Bug] "
labels:
  - type:bug
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide deterministic steps, inputs and environment details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include logs, exit codes or test results without secrets.
