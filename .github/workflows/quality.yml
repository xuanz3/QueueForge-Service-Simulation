name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpp-release:
    name: C++ release build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/simulation-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate example contract
        run: |
          ./build/queueforge-sim \
            --input ../../contracts/examples/basic-scenario.json \
            --output - \
            --validate-only

  cpp-sanitizers:
    name: C++ sanitizers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/simulation-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DQUEUEFORGE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure

  python:
    name: Python package tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics/queueforge-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Health command
        run: python -m queueforge_analytics health

  java:
    name: Java tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-plane-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test

  web:
    name: TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  repository:
    name: Repository verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Verify Phase 0
        run: python tools/verify_phase_0.py
      - name: Verify Phase 1
        run: python tools/verify_phase_1.py
      - name: Verify C++ runtime compatibility
        run: python tools/verify_cpp_runtime.py
      - name: Verify Phase 2
        run: python tools/verify_phase_2.py
      - name: Validate Compose
        run: docker compose config
