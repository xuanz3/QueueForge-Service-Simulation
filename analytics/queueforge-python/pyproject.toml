[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "queueforge-analytics"
version = "0.1.0"
description = "QueueForge analytics foundation"
requires-python = ">=3.14"
license = "MIT"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
